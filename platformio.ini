; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library op  tions: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lolin_s2_mini]
platform = espressif32 @ 6.9.0
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200

; The old prototype sources are deliberately retained for reference, but are not
; part of the competition firmware.
build_src_filter =  
    +<main.cpp>
    +<robot/>

build_flags =
    -D CORE_DEBUG_LEVEL=0

; Temporary profile for the generic ESP32-C3 SuperMini. PlatformIO does not
; provide a distinct SuperMini board definition; the compatible LOLIN C3 Mini
; definition supplies the correct ESP32-C3/4 MB/native-USB build settings.
[env:c3_supermini]
platform = espressif32 @ 6.9.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

build_src_filter =
    +<main.cpp>
    +<robot/>

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ROBOT_TARGET_C3_SUPERMINI
